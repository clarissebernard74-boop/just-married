<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Just Married — Atelier CRM</title>
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100'%3E%3Crect width='80' height='100' rx='6' fill='%231c1a17'/%3E%3Cpath d='M10 94V44a30 30 0 0 1 60 0v50' fill='none' stroke='%23f3efe7' stroke-width='3'/%3E%3Ctext x='40' y='78' font-family='Georgia' font-style='italic' font-size='34' text-anchor='middle' fill='%23f3efe7'%3EJM%3C/text%3E%3Cpath d='M40 6l6 7-6 7-6-7z' fill='%23b08d4a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3efe7;--paper-2:#ebe5da;--paper-3:#e2dacb;--card:#fbf9f4;
  --ink:#1c1a17;--ink-soft:#6b655c;--line:rgba(28,26,23,.14);
  --thread:#9c3b2e;--gold:#b08d4a;--blush:#d9a79c;--sage:#7d8b6a;--sky:#6f8fae;
  --serif:"Cormorant",Georgia,serif;--sans:"Jost",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--thread);outline-offset:3px}
.eyebrow{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;font-weight:400}
.serif{font-family:var(--serif);font-weight:300}
.muted{color:var(--ink-soft)}
[hidden]{display:none!important}

/* ---------- connexion ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lg-art{position:relative;background:var(--ink) url("https://images.unsplash.com/photo-1532454781337-fc3edff34f91?w=1400&q=70&auto=format&fit=crop") center/cover;color:var(--paper)}
.lg-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,15,.25),rgba(20,18,15,.7))}
.lg-art div{position:absolute;z-index:1;left:48px;right:48px;bottom:48px}
.lg-art h1{font-family:var(--serif);font-weight:300;font-size:clamp(44px,5vw,78px);line-height:.92;margin-top:16px}
.lg-art h1 em{color:var(--blush)}
.lg-form{display:grid;place-items:center;padding:40px 24px}
.lg-form form{width:min(380px,100%);display:flex;flex-direction:column;gap:22px}
.lg-form svg{width:46px;height:58px;margin-bottom:6px}
.lg-form h2{font-family:var(--serif);font-weight:300;font-size:40px;line-height:1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;outline:none;font-size:15px;transition:border-color .3s;border-radius:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink)}
.fld textarea{resize:vertical;min-height:70px}
.err{color:var(--thread);font-size:13px;min-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:13px 24px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;transition:background .3s,opacity .3s;white-space:nowrap}
.btn:hover{background:var(--thread)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btn.sm{padding:9px 16px}
.btn.danger{background:transparent;color:var(--thread);border:1px solid rgba(156,59,46,.35)}
.btn.danger:hover{background:var(--thread);color:var(--paper)}

/* ---------- application ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside.side{background:var(--ink);color:var(--paper);padding:26px 18px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand svg{width:30px;height:38px}
.brand b{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;line-height:1}
.brand small{color:rgba(243,239,231,.5);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 12px;color:rgba(243,239,231,.7);font-size:13.5px;transition:background .25s,color .25s}
.side nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.3}
.side nav button:hover{background:rgba(243,239,231,.06);color:var(--paper)}
.side nav button.on{background:rgba(243,239,231,.1);color:var(--paper)}
.side nav .count{margin-left:auto;background:var(--thread);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 8px;font-weight:400}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px;color:rgba(243,239,231,.55);font-size:12px}
.side .foot a{text-decoration:none;border-bottom:1px solid rgba(243,239,231,.25);align-self:flex-start}
.side .foot button{background:none;border:1px solid rgba(243,239,231,.2);color:var(--paper);border-radius:999px;padding:8px 14px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;align-self:flex-start}
.live{display:inline-flex;align-items:center;gap:8px}
.live i{width:7px;height:7px;border-radius:50%;background:#7fbf7a;box-shadow:0 0 0 0 rgba(127,191,122,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(127,191,122,0)}100%{box-shadow:0 0 0 0 rgba(127,191,122,0)}}

main{padding:30px clamp(18px,3vw,44px) 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.top h1{font-family:var(--serif);font-weight:300;font-size:clamp(36px,4vw,54px);line-height:1}
.top h1 em{font-style:italic;color:var(--thread)}
.top .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:none;border:0;border-radius:999px;padding:7px 14px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:var(--paper)}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;min-width:0}
.panel h3{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.1;margin-bottom:4px}
.panel .sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:16px}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;margin:10px 0 6px}
.kpi small{color:var(--ink-soft);font-size:12px}
.kpi .up{color:var(--sage)}.kpi .down{color:var(--thread)}
.two{grid-template-columns:1.6fr 1fr;margin-top:16px}
.three{grid-template-columns:repeat(3,1fr);margin-top:16px}
.chart{width:100%;height:220px;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--ink-soft);font-family:var(--sans)}
.legend{display:flex;gap:18px;font-size:12px;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:11px}
.bars .r{display:grid;grid-template-columns:110px 1fr 38px;align-items:center;gap:10px;font-size:13px}
.bars .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .t{height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:99px;background:var(--ink);transform-origin:left;animation:grow 1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.bars .r b{font-weight:400;text-align:right}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .s{position:relative;border-radius:10px;padding:10px 14px;background:var(--paper-2);overflow:hidden;display:flex;justify-content:space-between;font-size:13px}
.funnel .s i{position:absolute;inset:0;right:auto;background:rgba(176,141,74,.22);animation:grow 1.1s var(--ease) both}
.funnel .s span,.funnel .s b{position:relative;font-weight:400}
.feed{list-style:none;display:flex;flex-direction:column;max-height:380px;overflow:auto}
.feed li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--paper-2)}
.feed small{color:var(--ink-soft);font-size:11.5px;white-space:nowrap}
.feed .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-family:var(--serif);font-style:italic;font-size:19px}

/* ---------- pipeline ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.tools select{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:none}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--paper-2);border-radius:16px;padding:12px;min-height:300px;transition:background .25s,box-shadow .25s}
.col.over{background:var(--paper-3);box-shadow:inset 0 0 0 1px var(--ink)}
.col header{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px}
.col header span{display:inline-flex;align-items:center;gap:8px}
.col header i{width:8px;height:8px;border-radius:50%}
.col header small{color:var(--ink-soft)}
.col .sum{font-family:var(--serif);font-size:15px;color:var(--ink-soft);padding:0 4px 10px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;cursor:grab;transition:transform .25s var(--ease),box-shadow .25s}
.lead:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(40,30,20,.5)}
.lead.drag{opacity:.4}
.lead .n{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lead .n b{font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.1}
.lead .m{font-size:12px;color:var(--ink-soft);margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;border-radius:999px;padding:2px 9px;background:var(--paper-2);color:var(--ink-soft)}
.tag.hot{background:rgba(156,59,46,.12);color:var(--thread)}
.tag.rdv{background:rgba(111,143,174,.15);color:#45627f}
.tag.jy{background:rgba(176,141,74,.16);color:#7a5f2c}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--paper);flex:none}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-weight:400;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);background:var(--paper-2);cursor:pointer;user-select:none;white-space:nowrap}
tbody tr{cursor:pointer;transition:background .2s}
tbody tr:hover{background:var(--paper)}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;background:var(--paper-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%}
.tablewrap{overflow-x:auto}

/* ---------- fiche ---------- */
.scrim{position:fixed;inset:0;background:rgba(28,26,23,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:50;transform:translateX(102%);transition:transform .5s var(--ease);display:flex;flex-direction:column;box-shadow:-30px 0 60px -40px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.dr-head{padding:24px 26px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.dr-head .avatar{width:54px;height:54px;font-size:22px}
.dr-head h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1}
.dr-head .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:15px}
.dr-body{flex:1;overflow:auto;padding:20px 26px 30px;display:flex;flex-direction:column;gap:22px}
.dr-body .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-pick{display:flex;flex-wrap:wrap;gap:6px}
.stat-pick button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.stat-pick button i{width:7px;height:7px;border-radius:50%}
.stat-pick button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box p{white-space:pre-wrap}
.notes{list-style:none;display:flex;flex-direction:column;gap:10px}
.notes li{border-left:2px solid var(--gold);padding:2px 0 2px 12px}
.notes small,.hist small{display:block;color:var(--ink-soft);font-size:11px}
.hist{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.hist li{display:grid;grid-template-columns:12px 1fr;gap:10px}
.hist li::before{content:"";width:7px;height:7px;margin-top:6px;border-radius:50%;border:1px solid var(--gold)}
.journey{display:flex;flex-direction:column;gap:6px;font-size:12.5px;max-height:220px;overflow:auto}
.journey div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.dr-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:10px}
.ag{display:grid;grid-template-columns:86px 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer}
.ag .d{text-align:center;border-right:1px solid var(--line);padding-right:16px}
.ag .d b{display:block;font-family:var(--serif);font-size:34px;font-weight:400;line-height:1}
.ag .d small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 20px;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:13px;opacity:0;transition:.4s var(--ease);z-index:80;pointer-events:none}
.toast.on{opacity:1;translate:-50% 0}
dialog{border:0;border-radius:20px;padding:26px;width:min(520px,calc(100% - 32px));background:var(--paper);color:var(--ink);margin:auto}
dialog::backdrop{background:rgba(28,26,23,.4)}
dialog h2{font-family:var(--serif);font-weight:300;font-size:32px;margin-bottom:16px}
dialog form{display:flex;flex-direction:column;gap:14px}
dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.burger{display:none}
.skel{background:linear-gradient(90deg,var(--paper-2),var(--paper),var(--paper-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:110px}
@keyframes sk{to{background-position:-200% 0}}

@media (max-width:1100px){.two,.three{grid-template-columns:1fr}}
@media (max-width:860px){
  #login{grid-template-columns:1fr}.lg-art{min-height:240px}
  #app{grid-template-columns:1fr}
  aside.side{position:fixed;inset:0 auto 0 0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .4s var(--ease)}
  aside.side.on{transform:none}
  .burger{display:inline-flex}
  .dr-body .row,dialog .row{grid-template-columns:1fr}
  .ag{grid-template-columns:64px 1fr}.ag>:last-child{display:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="arch" viewBox="0 0 80 100">
    <path d="M6 97V42a34 34 0 0 1 68 0v55" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M12 97V42a28 28 0 0 1 56 0v55" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray="2.2 2.2"/>
    <path d="M40 3l3.6 4.2L40 11.4l-3.6-4.2z" fill="#b08d4a"/>
    <text x="40" y="76" font-family="Cormorant, Georgia, serif" font-style="italic" font-size="36" text-anchor="middle" fill="currentColor">JM</text>
  </symbol>
</svg>

<!-- Connexion -->
<section id="login" hidden>
  <div class="lg-art"><div>
    <span class="eyebrow">Just Married — 5 rue Duguesclin, Lyon 6e</span>
    <h1>Le carnet<br>de <em>l'atelier.</em></h1>
  </div></div>
  <div class="lg-form">
    <form id="lg">
      <svg><use href="#arch"/></svg>
      <span class="eyebrow muted">Espace réservé à l'atelier</span>
      <h2>Connexion</h2>
      <div class="fld"><label for="lg-id">Identifiant admin</label><input id="lg-id" autocomplete="username" required></div>
      <div class="fld"><label for="lg-pw">Mot de passe</label><input id="lg-pw" type="password" autocomplete="current-password" required></div>
      <p class="err" id="lg-err" role="alert"></p>
      <button class="btn" type="submit">Entrer dans le CRM</button>
      <a class="muted" href="/" style="font-size:12.5px">← Retour au site</a>
    </form>
  </div>
</section>

<!-- Application -->
<div id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><svg><use href="#arch"/></svg><div><b>Just Married</b><small>Atelier CRM</small></div></div>
    <nav id="nav">
      <button data-v="dash" class="on"><svg viewBox="0 0 20 20"><path d="M3 11h5v6H3zM12 3h5v14h-5zM3 3h5v5H3z"/></svg>Tableau de bord</button>
      <button data-v="pipe"><svg viewBox="0 0 20 20"><path d="M2 4h4v12H2zM8 4h4v8H8zM14 4h4v5h-4z"/></svg>Pipeline<span class="count" id="c-new" hidden></span></button>
      <button data-v="list"><svg viewBox="0 0 20 20"><circle cx="10" cy="7" r="3.5"/><path d="M3 18c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></svg>Clientes</button>
      <button data-v="agenda"><svg viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="13" rx="2"/><path d="M2.5 8h15M6.5 2v4M13.5 2v4"/></svg>Agenda</button>
      <button data-v="robes"><svg viewBox="0 0 20 20"><path d="M7 2h6l-1 5 4 11H4L8 7z"/></svg>Robes</button>
      <button data-v="activity"><svg viewBox="0 0 20 20"><path d="M2 11h4l2-6 4 11 2-5h4"/></svg>Activité du site</button>
    </nav>
    <div class="foot">
      <span class="live"><i></i>Collecte en direct</span>
      <span id="who"></span>
      <a href="/" target="_blank" rel="noopener">Voir le site ↗</a>
      <button id="logout">Se déconnecter</button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div>
        <button class="btn ghost sm burger" id="burger" aria-label="Menu">☰ Menu</button>
        <span class="eyebrow muted" id="crumb">Vue d'ensemble</span>
        <h1 id="title">Bonjour, <em>l'atelier.</em></h1>
      </div>
      <div class="acts">
        <div class="seg" id="range"><button data-d="7">7 j</button><button data-d="30" class="on">30 j</button><button data-d="90">90 j</button></div>
        <button class="btn ghost sm" id="refresh">↻ Actualiser</button>
        <button class="btn sm" id="add">+ Nouvelle cliente</button>
      </div>
    </div>
    <div id="view"><div class="grid kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Fiche cliente"></aside>

<dialog id="dlg">
  <h2>Nouvelle <em class="serif">cliente</em></h2>
  <form id="addf" method="dialog">
    <div class="row"><div class="fld"><label>Prénom</label><input name="prenom" required></div><div class="fld"><label>Nom</label><input name="nom"></div></div>
    <div class="row"><div class="fld"><label>E-mail</label><input name="email" type="email"></div><div class="fld"><label>Téléphone</label><input name="tel"></div></div>
    <div class="row"><div class="fld"><label>Date de la noce</label><input name="dateNoce" placeholder="Juin 2027"></div><div class="fld"><label>Modèle</label><select name="modele" id="add-mod"></select></div></div>
    <div class="row"><div class="fld"><label>Source</label><select name="source"><option>Téléphone</option><option>Passage à l'atelier</option><option>Instagram</option><option>Salon du mariage</option><option>Recommandation</option></select></div><div class="fld"><label>Budget</label><input name="budget" placeholder="3 500 €"></div></div>
    <div class="fld"><label>Message</label><textarea name="message"></textarea></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" value="cancel" formnovalidate>Annuler</button><button class="btn" value="ok">Créer la fiche</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} }, del: k => { try { sessionStorage.removeItem(k); } catch (e) {} }};

// Catalogue (prix des robes, pour la valeur du pipeline)
const ROBES = {mathilde:['Mathilde',3400], augustine:['Augustine',3900], jeanne:['Jeanne',3600], eugenie:['Eugénie',2900], louise:['Louise',3800], celeste:['Céleste',4200], hortense:['Hortense',4100], marguerite:['Marguerite',2700], rose:['Rose',3200], adele:['Adèle',3500], blanche:['Blanche',4400]};
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const robeOf = modele => { const n = norm(modele); if (n.startsWith('just you')) return ['Just You', 3400]; const k = Object.keys(ROBES).find(k => n.startsWith(k)); return k ? ROBES[k] : null; };
const valueOf = l => { const b = parseInt(String(l.budget || '').replace(/\D/g, ''), 10); if (b) return b; const r = robeOf(l.modele); return r ? r[1] : 0; };
const STATUTS = [
  ['nouveau', 'Nouvelle demande', '#9c3b2e'], ['contacte', 'Contactée', '#b08d4a'], ['essayage', 'Essayage prévu', '#6f8fae'],
  ['commande', 'Commande', '#7d8b6a'], ['livree', 'Robe livrée', '#1c1a17'], ['perdu', 'Sans suite', '#a39d93']
];
const ST = Object.fromEntries(STATUTS.map(s => [s[0], s]));
const COLORS = ['#9c3b2e','#b08d4a','#6f8fae','#7d8b6a','#8a6f8f','#c07a5a','#5f7d7a'];
const colorOf = s => COLORS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initials = l => ((l.prenom || l.email || '?')[0] + (l.nom ? l.nom[0] : '')).toUpperCase();
const fullName = l => [l.prenom, l.nom].filter(Boolean).join(' ') || l.email || 'Sans nom';
const eur = n => n.toLocaleString('fr-FR') + ' €';
const fdate = (d, o = {day:'numeric', month:'short'}) => new Date(d).toLocaleDateString('fr-FR', o);
const ftime = d => new Date(d).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; if (s < 60) return "à l'instant"; if (s < 3600) return `il y a ${Math.floor(s / 60)} min`; if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`; return `il y a ${Math.floor(s / 86400)} j`; };
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2600); };

// ---------- API ----------
let token = store.get('jm-crm'), me = store.get('jm-crm-id');
const api = async (path, opt = {}) => {
  const r = await fetch(path, {...opt, headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opt.headers || {})}, body: opt.body ? JSON.stringify(opt.body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error(j.error || 'Session expirée'); }
  if (!r.ok) throw new Error(j.error || 'Erreur ' + r.status);
  return j;
};

// ---------- Connexion ----------
$('#lg').addEventListener('submit', async e => {
  e.preventDefault();
  const b = e.target.querySelector('.btn'); b.disabled = true; $('#lg-err').textContent = '';
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: $('#lg-id').value, password: $('#lg-pw').value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Connexion impossible');
    token = j.token; me = j.id; store.set('jm-crm', token); store.set('jm-crm-id', me);
    $('#lg-pw').value = '';
    start();
  } catch (err) { $('#lg-err').textContent = err.message; }
  b.disabled = false;
});
function logout() { token = null; store.del('jm-crm'); store.del('jm-crm-id'); clearInterval(timer); $('#app').hidden = true; $('#login').hidden = false; }
$('#logout').onclick = logout;

// ---------- Données ----------
let leads = [], events = [], days = 30, view = 'dash', timer, filter = {q:'', statut:'', modele:''}, sort = ['createdAt', -1];
async function load(quiet) {
  try {
    const [a, b] = await Promise.all([api('/api/leads'), api('/api/events')]);
    const before = leads.length;
    leads = a.leads; events = b.events;
    if (quiet && leads.length > before) toast(`${leads.length - before} nouvelle(s) demande(s) reçue(s)`);
    const n = leads.filter(l => l.statut === 'nouveau').length;
    $('#c-new').hidden = !n; $('#c-new').textContent = n;
    render();
  } catch (err) { if (!quiet) toast(err.message); }
}
function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#who').textContent = 'Connectée : ' + (me || 'admin');
  load();
  clearInterval(timer); timer = setInterval(() => load(true), 30000);
}
const inRange = at => at >= Date.now() - days * 864e5;

// ---------- Navigation ----------
const TITLES = {dash:["Vue d'ensemble", "Bonjour, <em>l'atelier.</em>"], pipe:['Suivi des demandes', 'Le <em>pipeline</em>'], list:['Toutes les fiches', 'Les <em>clientes</em>'], agenda:['Rendez-vous à venir', "L'<em>agenda</em>"], robes:['Performance de la collection', 'Les <em>robes</em>'], activity:['Tout ce qui se passe sur le site', 'Activité <em>du site</em>']};
$$('#nav button').forEach(b => b.onclick = () => { view = b.dataset.v; $$('#nav button').forEach(x => x.classList.toggle('on', x === b)); $('#side').classList.remove('on'); render(); });
$$('#range button').forEach(b => b.onclick = () => { days = +b.dataset.d; $$('#range button').forEach(x => x.classList.toggle('on', x === b)); render(); });
$('#refresh').onclick = () => { load(); toast('Données actualisées'); };
$('#burger').onclick = () => $('#side').classList.toggle('on');

function render() {
  $('#crumb').textContent = TITLES[view][0]; $('#title').innerHTML = TITLES[view][1];
  $('#range').style.display = ['dash', 'robes', 'activity'].includes(view) ? '' : 'none';
  ({dash, pipe, list, agenda, robes, activity})[view]();
}

// ---------- Tableau de bord ----------
function dash() {
  const ev = events.filter(e => inRange(e.at)), prev = events.filter(e => e.at < Date.now() - days * 864e5 && e.at >= Date.now() - 2 * days * 864e5);
  const ld = leads.filter(l => inRange(+new Date(l.createdAt)));
  const visitors = new Set(ev.map(e => e.v)).size, pvisitors = new Set(prev.map(e => e.v)).size;
  const views = ev.filter(e => e.t === 'page' || e.t === 'robe').length;
  const conv = visitors ? (ld.length / visitors * 100) : 0;
  const pipeVal = leads.filter(l => ['nouveau', 'contacte', 'essayage'].includes(l.statut)).reduce((a, l) => a + valueOf(l), 0);
  const sold = leads.filter(l => ['commande', 'livree'].includes(l.statut)).reduce((a, l) => a + valueOf(l), 0);
  const delta = (a, b) => b ? `<span class="${a >= b ? 'up' : 'down'}">${a >= b ? '↑' : '↓'} ${Math.abs(Math.round((a - b) / b * 100))} %</span> vs période précédente` : 'sur la période';
  const upcoming = leads.filter(l => l.rdv && new Date(l.rdv) >= new Date(new Date().toDateString())).sort((a, b) => a.rdv.localeCompare(b.rdv));

  // Courbe : visiteurs et demandes par jour
  const N = Math.min(days, 30), step = days / N, buckets = [];
  for (let i = N - 1; i >= 0; i--) { const end = Date.now() - i * step * 864e5, startT = end - step * 864e5; buckets.push({d: end, v: new Set(events.filter(e => e.at > startT && e.at <= end).map(e => e.v)).size, l: leads.filter(l => { const t = +new Date(l.createdAt); return t > startT && t <= end; }).length}); }
  const W = 640, H = 200, max = Math.max(4, ...buckets.map(b => b.v)), x = i => 30 + i * (W - 40) / (N - 1 || 1), y = v => H - 20 - v / max * (H - 40);
  const line = buckets.map((b, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(b.v).toFixed(1)}`).join('');
  const area = line + `L${x(N - 1)} ${H - 20}L${x(0)} ${H - 20}Z`;
  const lmax = Math.max(1, ...buckets.map(b => b.l));
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b08d4a" stop-opacity=".35"/><stop offset="1" stop-color="#b08d4a" stop-opacity="0"/></linearGradient></defs>
    ${[0, .5, 1].map(f => `<line x1="30" x2="${W - 10}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="rgba(28,26,23,.08)"/><text x="0" y="${y(max * f) + 3}">${Math.round(max * f)}</text>`).join('')}
    ${buckets.map((b, i) => b.l ? `<rect x="${x(i) - 4}" y="${H - 20 - b.l / lmax * 50}" width="8" height="${b.l / lmax * 50}" rx="3" fill="#9c3b2e" opacity=".85"><title>${b.l} demande(s)</title></rect>` : '').join('')}
    <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#1c1a17" stroke-width="1.6" stroke-linejoin="round" style="stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.6s var(--ease) forwards"/>
    ${buckets.map((b, i) => i % Math.ceil(N / 6) === 0 || i === N - 1 ? `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${fdate(b.d)}</text>` : '').join('')}
  </svg><style>@keyframes draw{to{stroke-dashoffset:0}}</style>`;

  // Robes les plus regardées
  const rv = {};
  ev.forEach(e => { let k = null; if (e.t === 'robe') k = ROBES[e.l]?.[0]; else if (e.t === 'clic' && e.l.startsWith('Carte : ')) k = e.l.slice(8); if (k) rv[k] = (rv[k] || 0) + 1; });
  const top = Object.entries(rv).sort((a, b) => b[1] - a[1]).slice(0, 6), tmax = top[0]?.[1] || 1;

  // Tunnel
  const vSet = t => new Set(ev.filter(t).map(e => e.v)).size;
  const fun = [['Visiteuses', visitors], ['Ont regardé une robe', vSet(e => e.t === 'robe' || (e.t === 'clic' && e.l.startsWith('Carte')))], ['Ont cliqué « Essayer » ou configuré', vSet(e => e.t === 'justyou' || (e.t === 'clic' && /essayer|rendez-vous|just you/i.test(e.l)))], ['Ont demandé un rendez-vous', ld.length], ['Ont commandé', ld.filter(l => ['commande', 'livree'].includes(l.statut)).length]];
  const fmax = fun[0][1] || 1;

  // Sources
  const src = {}; ld.forEach(l => src[l.source || 'Site'] = (src[l.source || 'Site'] || 0) + 1);
  const ref = {}; ev.filter(e => e.r && (e.t === 'page' || e.t === 'robe')).forEach(e => ref[e.r] = (ref[e.r] || 0) + 1);

  $('#view').innerHTML = `
  <div class="grid kpis">
    <div class="panel kpi"><span class="eyebrow muted">Visiteuses uniques</span><b>${visitors}</b><small>${delta(visitors, pvisitors)}</small></div>
    <div class="panel kpi"><span class="eyebrow muted">Pages vues</span><b>${views}</b><small>${ev.filter(e => e.t === 'video').length} vidéos lancées</small></div>
    <div class="panel kpi"><span class="eyebrow muted">Demandes de rendez-vous</span><b>${ld.length}</b><small>Conversion ${conv.toFixed(1).replace('.', ',')} %</small></div>
    <div class="panel kpi"><span class="eyebrow muted">Pipeline en cours</span><b>${eur(pipeVal)}</b><small>${eur(sold)} déjà commandés</small></div>
  </div>
  <div class="grid two">
    <div class="panel"><h3>Fréquentation</h3><p class="sub">Visiteuses par jour et demandes reçues</p>${chart}
      <div class="legend"><span><i style="background:#1c1a17"></i>Visiteuses</span><span><i style="background:#9c3b2e"></i>Demandes</span></div></div>
    <div class="panel"><h3>Tunnel de conversion</h3><p class="sub">Du premier regard à la commande</p>
      <div class="funnel">${fun.map(f => `<div class="s"><i style="width:${Math.max(4, f[1] / fmax * 100)}%"></i><span>${f[0]}</span><b>${f[1]}</b></div>`).join('')}</div></div>
  </div>
  <div class="grid three">
    <div class="panel"><h3>Robes les plus regardées</h3><p class="sub">Pages robe et clics sur les cartes</p>
      ${top.length ? `<div class="bars">${top.map(([k, v]) => `<div class="r"><span>${esc(k)}</span><div class="t"><i style="width:${v / tmax * 100}%"></i></div><b>${v}</b></div>`).join('')}</div>` : '<p class="empty">Pas encore de données</p>'}</div>
    <div class="panel"><h3>Dernières demandes</h3><p class="sub">Cliquez pour ouvrir la fiche</p>
      ${leads.length ? `<ul class="feed">${leads.slice(0, 6).map(l => `<li data-id="${l.id}" style="cursor:pointer"><span class="avatar" style="background:${colorOf(l.email)};width:28px;height:28px;font-size:12px">${esc(initials(l))}</span><span class="lbl"><b style="font-weight:400">${esc(fullName(l))}</b> — ${esc(l.modele || '—')}</span><small>${ago(l.createdAt)}</small></li>`).join('')}</ul>` : '<p class="empty">Aucune demande pour l\'instant</p>'}</div>
    <div class="panel"><h3>Prochains rendez-vous</h3><p class="sub">Essayages à l'atelier</p>
      ${upcoming.length ? `<ul class="feed">${upcoming.slice(0, 6).map(l => `<li data-id="${l.id}" style="cursor:pointer"><span class="ic">◆</span><span class="lbl">${esc(fullName(l))}</span><small>${fdate(l.rdv, {weekday:'short', day:'numeric', month:'short'})} ${ftime(l.rdv)}</small></li>`).join('')}</ul>` : '<p class="empty">Aucun rendez-vous fixé</p>'}</div>
  </div>
  <div class="grid two">
    <div class="panel"><h3>En direct sur le site</h3><p class="sub">Les derniers gestes des visiteuses</p>${feed(ev.slice(0, 12))}</div>
    <div class="panel"><h3>Origine</h3><p class="sub">Source des demandes et sites référents</p>
      ${barsOf(src, 'Aucune demande')}<div style="height:18px"></div>${barsOf(ref, 'Aucun site référent')}</div>
  </div>`;
  $$('#view [data-id]').forEach(e => e.onclick = () => openLead(e.dataset.id));
}
const barsOf = (o, emptyTxt) => { const e = Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 5), m = e[0]?.[1] || 1; return e.length ? `<div class="bars">${e.map(([k, v]) => `<div class="r"><span title="${esc(k)}">${esc(k)}</span><div class="t"><i style="width:${v / m * 100}%;background:var(--gold)"></i></div><b>${v}</b></div>`).join('')}</div>` : `<p class="muted" style="font-size:13px">${emptyTxt}</p>`; };
const EV = {page:['◎','A ouvert'], robe:['◆','A regardé la robe'], clic:['↗','A cliqué'], video:['▶','A lancé la vidéo'], justyou:['✎','A composé une Just You'], formulaire:['✉','Formulaire'], lead:['★','A demandé un rendez-vous']};
const evLabel = e => e.t === 'robe' ? (ROBES[e.l]?.[0] || e.l) : e.l;
const feed = list => list.length ? `<ul class="feed">${list.map(e => `<li><span class="ic" ${e.t === 'lead' ? 'style="background:rgba(156,59,46,.15);color:#9c3b2e"' : ''}>${EV[e.t]?.[0] || '·'}</span><span class="lbl">${EV[e.t]?.[1] || e.t} <b style="font-weight:400">${esc(evLabel(e))}</b> <span class="muted">· visiteuse ${esc(String(e.v).slice(0, 5))}</span></span><small>${ago(e.at)}</small></li>`).join('')}</ul>` : '<p class="empty">Le site attend ses premières visiteuses</p>';

// ---------- Pipeline (glisser-déposer) ----------
const match = l => (!filter.q || norm([fullName(l), l.email, l.modele, l.message, l.tel].join(' ')).includes(norm(filter.q))) && (!filter.statut || l.statut === filter.statut) && (!filter.modele || (robeOf(l.modele)?.[0] || 'Autre') === filter.modele);
const toolbar = (withStatut) => `<div class="tools"><label class="search">⌕<input id="q" placeholder="Rechercher une cliente, un e-mail, une robe…" value="${esc(filter.q)}"></label>
  ${withStatut ? `<select id="fs"><option value="">Tous les statuts</option>${STATUTS.map(s => `<option value="${s[0]}" ${filter.statut === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}</select>` : ''}
  <select id="fm"><option value="">Toutes les robes</option>${[...Object.values(ROBES).map(r => r[0]), 'Just You', 'Autre'].map(n => `<option ${filter.modele === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
  <button class="btn ghost sm" id="csv">Exporter CSV</button></div>`;
const bindTools = () => {
  const q = $('#q'); q.oninput = () => { filter.q = q.value; const p = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  if ($('#fs')) $('#fs').onchange = e => { filter.statut = e.target.value; render(); };
  $('#fm').onchange = e => { filter.modele = e.target.value; render(); };
  $('#csv').onclick = exportCSV;
};
const tagsOf = l => `${l.priorite === 'haute' ? '<span class="tag hot">Prioritaire</span>' : ''}${l.rdv ? `<span class="tag rdv">${fdate(l.rdv)} ${ftime(l.rdv)}</span>` : ''}${/just you/i.test(l.modele) ? '<span class="tag jy">Sur mesure</span>' : ''}${l.dateNoce ? `<span class="tag">Noce : ${esc(l.dateNoce)}</span>` : ''}`;
function pipe() {
  const L = leads.filter(match);
  $('#view').innerHTML = toolbar(false) + `<div class="board">${STATUTS.map(([k, name, c]) => { const items = L.filter(l => l.statut === k); return `
    <div class="col" data-s="${k}"><header><span><i style="background:${c}"></i>${name}</span><small>${items.length}</small></header>
    <div class="sum">${eur(items.reduce((a, l) => a + valueOf(l), 0))}</div>
    ${items.map(l => `<div class="lead" draggable="true" data-id="${l.id}"><div class="n"><b>${esc(fullName(l))}</b><small class="muted">${ago(l.createdAt)}</small></div><div class="m">${esc(l.modele || 'Modèle à définir')} · ${eur(valueOf(l))}</div><div class="tags">${tagsOf(l)}</div></div>`).join('') || '<p class="muted" style="font-size:12px;padding:6px 4px">Glissez une fiche ici</p>'}
    </div>`; }).join('')}</div>`;
  bindTools();
  $$('.lead').forEach(c => {
    c.onclick = () => openLead(c.dataset.id);
    c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('drag'); };
    c.ondragend = () => c.classList.remove('drag');
  });
  $$('.col').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = () => col.classList.remove('over');
    col.ondrop = e => { e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); const l = leads.find(x => x.id === id); if (l && l.statut !== col.dataset.s) update(id, {statut: col.dataset.s}, `${fullName(l)} → ${ST[col.dataset.s][1]}`); };
  });
}

// ---------- Liste ----------
function list() {
  const L = leads.filter(match).sort((a, b) => { const k = sort[0]; const va = k === 'valeur' ? valueOf(a) : (a[k] || ''), vb = k === 'valeur' ? valueOf(b) : (b[k] || ''); return (va > vb ? 1 : va < vb ? -1 : 0) * sort[1]; });
  const th = (k, t) => `<th data-k="${k}">${t}${sort[0] === k ? (sort[1] > 0 ? ' ↑' : ' ↓') : ''}</th>`;
  $('#view').innerHTML = toolbar(true) + (L.length ? `<div class="tablewrap"><table><thead><tr>${th('prenom', 'Cliente')}${th('modele', 'Modèle')}${th('statut', 'Statut')}${th('dateNoce', 'Noce')}${th('source', 'Source')}${th('valeur', 'Valeur')}${th('createdAt', 'Reçue')}</tr></thead><tbody>
    ${L.map(l => `<tr data-id="${l.id}"><td><div class="who"><span class="avatar" style="background:${colorOf(l.email)}">${esc(initials(l))}</span><div><b>${esc(fullName(l))}</b><br><small class="muted">${esc(l.email)}</small></div></div></td><td>${esc(l.modele || '—')}</td><td><span class="pill"><i style="background:${ST[l.statut][2]}"></i>${ST[l.statut][1]}</span></td><td>${esc(l.dateNoce || '—')}</td><td>${esc(l.source)}</td><td>${eur(valueOf(l))}</td><td>${fdate(l.createdAt)}</td></tr>`).join('')}
  </tbody></table></div>` : '<p class="empty">Aucune fiche ne correspond</p>');
  bindTools();
  $$('th[data-k]').forEach(t => t.onclick = () => { sort = [t.dataset.k, sort[0] === t.dataset.k ? -sort[1] : 1]; render(); });
  $$('tbody tr').forEach(r => r.onclick = () => openLead(r.dataset.id));
}
function exportCSV() {
  const cols = ['createdAt', 'prenom', 'nom', 'email', 'tel', 'dateNoce', 'modele', 'statut', 'priorite', 'rdv', 'budget', 'source', 'message', 'config'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + [cols.join(';'), ...leads.filter(match).map(l => cols.map(c => q(c === 'statut' ? ST[l.statut][1] : l[c])).join(';'))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = `just-married-clientes-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  toast('Export CSV téléchargé');
}

// ---------- Agenda ----------
function agenda() {
  const today = new Date(new Date().toDateString());
  const A = leads.filter(l => l.rdv).sort((a, b) => a.rdv.localeCompare(b.rdv));
  const next = A.filter(l => new Date(l.rdv) >= today), past = A.filter(l => new Date(l.rdv) < today).reverse();
  const card = l => `<div class="ag" data-id="${l.id}"><div class="d"><small>${fdate(l.rdv, {weekday:'short'})}</small><b>${new Date(l.rdv).getDate()}</b><small>${fdate(l.rdv, {month:'short'})}</small></div><div><b class="serif" style="font-size:21px;font-weight:400">${esc(fullName(l))}</b><div class="muted" style="font-size:12.5px">${ftime(l.rdv)} · ${esc(l.modele || 'Modèle à définir')} · ${esc(l.tel || l.email)}</div></div><span class="pill"><i style="background:${ST[l.statut][2]}"></i>${ST[l.statut][1]}</span></div>`;
  $('#view').innerHTML = `<div class="panel"><h3>À venir</h3><p class="sub">Fixez un rendez-vous depuis la fiche d'une cliente</p><div class="agenda">${next.map(card).join('') || '<p class="empty">Aucun rendez-vous à venir</p>'}</div></div>
    ${past.length ? `<div class="panel" style="margin-top:16px"><h3>Passés</h3><p class="sub">Historique des essayages</p><div class="agenda">${past.slice(0, 20).map(card).join('')}</div></div>` : ''}`;
  $$('.ag').forEach(e => e.onclick = () => openLead(e.dataset.id));
}

// ---------- Robes ----------
function robes() {
  const ev = events.filter(e => inRange(e.at));
  const rows = [...Object.entries(ROBES), ['just-you', ['Just You', 3400]]].map(([slug, [name, price]]) => {
    const vues = ev.filter(e => (e.t === 'robe' && e.l === slug) || (e.t === 'clic' && e.l === 'Carte : ' + name)).length;
    const dem = leads.filter(l => robeOf(l.modele)?.[0] === name);
    const cmd = dem.filter(l => ['commande', 'livree'].includes(l.statut));
    return {name, price, vues, dem: dem.length, cmd: cmd.length, ca: cmd.reduce((a, l) => a + valueOf(l), 0)};
  });
  const jy = ev.filter(e => e.t === 'justyou').length;
  const vmax = Math.max(1, ...rows.map(r => r.vues));
  $('#view').innerHTML = `<div class="grid kpis">
      <div class="panel kpi"><span class="eyebrow muted">Robe la plus regardée</span><b style="font-size:36px">${[...rows].sort((a, b) => b.vues - a.vues)[0].vues ? esc([...rows].sort((a, b) => b.vues - a.vues)[0].name) : '—'}</b><small>sur ${days} jours</small></div>
      <div class="panel kpi"><span class="eyebrow muted">Configurations Just You</span><b>${jy}</b><small>envoyées vers le rendez-vous</small></div>
      <div class="panel kpi"><span class="eyebrow muted">Robes commandées</span><b>${rows.reduce((a, r) => a + r.cmd, 0)}</b><small>${eur(rows.reduce((a, r) => a + r.ca, 0))}</small></div>
    </div>
    <div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>Modèle</th><th>Prix</th><th>Intérêt</th><th>Vues</th><th>Demandes</th><th>Commandes</th><th>Chiffre</th></tr></thead><tbody>
    ${rows.map(r => `<tr style="cursor:default"><td><b class="serif" style="font-size:19px;font-weight:400">${r.name}</b></td><td>${r.name === 'Just You' ? 'dès ' : ''}${eur(r.price)}</td><td style="width:26%"><div class="bars"><div class="t"><i style="width:${r.vues / vmax * 100}%"></i></div></div></td><td>${r.vues}</td><td>${r.dem}</td><td>${r.cmd}</td><td>${eur(r.ca)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

// ---------- Activité ----------
function activity() {
  const ev = events.filter(e => inRange(e.at));
  const by = {}; ev.forEach(e => by[e.t] = (by[e.t] || 0) + 1);
  const clicks = {}; ev.filter(e => e.t === 'clic').forEach(e => clicks[e.l] = (clicks[e.l] || 0) + 1);
  const vids = {}; ev.filter(e => e.t === 'video').forEach(e => vids[e.l] = (vids[e.l] || 0) + 1);
  $('#view').innerHTML = `<div class="grid kpis">${Object.entries(EV).map(([k, [ic, t]]) => `<div class="panel kpi"><span class="eyebrow muted">${ic} ${t.replace(/^A (ouvert|regardé|cliqué|lancé|composé|demandé)/, m => m)}</span><b>${by[k] || 0}</b><small>${k === 'page' ? 'pages ouvertes' : k === 'clic' ? 'boutons et liens' : ''}</small></div>`).join('')}</div>
    <div class="grid two"><div class="panel"><h3>Journal</h3><p class="sub">${ev.length} événements sur ${days} jours</p>${feed(ev.slice(0, 150))}</div>
    <div><div class="panel"><h3>Boutons les plus cliqués</h3><p class="sub">Tous les liens et boutons du site</p>${barsOf(clicks, 'Aucun clic')}</div>
    <div class="panel" style="margin-top:16px"><h3>Vidéos lancées</h3><p class="sub">Par section du site</p>${barsOf(vids, 'Aucune vidéo lancée')}</div></div></div>`;
}

// ---------- Fiche cliente ----------
let current = null;
function openLead(id) {
  const l = leads.find(x => x.id === id); if (!l) return;
  current = id;
  const journey = events.filter(e => l.vid && e.v === l.vid).slice(0, 40);
  const rdvVal = l.rdv ? new Date(new Date(l.rdv) - new Date(l.rdv).getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';
  $('#drawer').innerHTML = `
    <div class="dr-head"><span class="avatar" style="background:${colorOf(l.email)}">${esc(initials(l))}</span><div><span class="eyebrow muted">${esc(l.source)} · ${fdate(l.createdAt, {day:'numeric', month:'long', year:'numeric'})}</span><h2>${esc(fullName(l))}</h2></div><button class="x" id="dr-x" aria-label="Fermer">✕</button></div>
    <div class="dr-body">
      <div><span class="eyebrow muted">Statut</span><div class="stat-pick" style="margin-top:8px">${STATUTS.map(s => `<button data-s="${s[0]}" class="${l.statut === s[0] ? 'on' : ''}"><i style="background:${s[2]}"></i>${s[1]}</button>`).join('')}</div></div>
      <form id="lf" class="dr-form" style="display:flex;flex-direction:column;gap:14px">
        <div class="row"><div class="fld"><label>Prénom</label><input name="prenom" value="${esc(l.prenom)}"></div><div class="fld"><label>Nom</label><input name="nom" value="${esc(l.nom)}"></div></div>
        <div class="row"><div class="fld"><label>E-mail</label><input name="email" value="${esc(l.email)}"></div><div class="fld"><label>Téléphone</label><input name="tel" value="${esc(l.tel)}"></div></div>
        <div class="row"><div class="fld"><label>Modèle</label><input name="modele" value="${esc(l.modele)}"></div><div class="fld"><label>Date de la noce</label><input name="dateNoce" value="${esc(l.dateNoce)}"></div></div>
        <div class="row"><div class="fld"><label>Rendez-vous d'essayage</label><input name="rdv" type="datetime-local" value="${rdvVal}"></div><div class="fld"><label>Budget / montant</label><input name="budget" value="${esc(l.budget)}" placeholder="${eur(valueOf(l))}"></div></div>
        <div class="fld"><label>Priorité</label><select name="priorite">${['basse', 'normale', 'haute'].map(p => `<option ${l.priorite === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
        <button class="btn sm" style="align-self:flex-start">Enregistrer</button>
      </form>
      ${l.message ? `<div><span class="eyebrow muted">Son message</span><div class="box" style="margin-top:8px"><p class="serif" style="font-size:18px;font-style:italic">${esc(l.message)}</p></div></div>` : ''}
      ${l.config ? `<div><span class="eyebrow muted">Configuration Just You</span><div class="box" style="margin-top:8px"><p>${esc(l.config)}</p></div></div>` : ''}
      <div><span class="eyebrow muted">Notes de l'atelier</span>
        <form id="nf" style="display:flex;gap:8px;margin:8px 0 12px"><input name="note" placeholder="Ajouter une note (appel, mesures, envies…)" style="flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:none"><button class="btn sm">Ajouter</button></form>
        <ul class="notes">${(l.notes || []).map(n => `<li>${esc(n.txt)}<small>${fdate(n.at, {day:'numeric', month:'short', year:'numeric'})} · ${ftime(n.at)}</small></li>`).join('') || '<li class="muted" style="border:0;padding:0">Aucune note</li>'}</ul></div>
      ${journey.length ? `<div><span class="eyebrow muted">Son parcours sur le site</span><div class="journey" style="margin-top:8px">${journey.map(e => `<div><span>${EV[e.t]?.[0] || '·'} ${EV[e.t]?.[1] || e.t} ${esc(evLabel(e))}</span><small class="muted">${fdate(e.at)} ${ftime(e.at)}</small></div>`).join('')}</div></div>` : ''}
      <div><span class="eyebrow muted">Historique</span><ul class="hist" style="margin-top:8px">${[...(l.historique || [])].reverse().map(h => `<li><span>${esc(h.txt)}<small>${fdate(h.at, {day:'numeric', month:'short', year:'numeric'})} · ${ftime(h.at)}</small></span></li>`).join('')}</ul></div>
    </div>
    <div class="dr-foot">
      <div style="display:flex;gap:8px;flex-wrap:wrap">${l.email ? `<a class="btn sm" href="mailto:${esc(l.email)}?subject=${encodeURIComponent('Votre rendez-vous chez Just Married')}&body=${encodeURIComponent(`Bonjour ${l.prenom || ''},\n\nMerci pour votre demande${l.modele ? ' concernant ' + l.modele : ''}. `)}">Écrire un e-mail</a>` : ''}${l.tel ? `<a class="btn ghost sm" href="tel:${esc(l.tel)}">Appeler</a>` : ''}</div>
      <button class="btn danger sm" id="del">Supprimer</button>
    </div>`;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
  $('#dr-x').onclick = closeLead;
  $$('.stat-pick button').forEach(b => b.onclick = () => update(id, {statut: b.dataset.s}, 'Statut : ' + ST[b.dataset.s][1]));
  $('#lf').onsubmit = e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); if (d.rdv) d.rdv = new Date(d.rdv).toISOString(); if (d.rdv === (l.rdv || '')) delete d.rdv; update(id, d, 'Fiche enregistrée'); };
  $('#nf').onsubmit = e => { e.preventDefault(); const v = e.target.note.value.trim(); if (v) update(id, {note: v}, 'Note ajoutée'); };
  $('#del').onclick = async () => { if (!confirm(`Supprimer définitivement la fiche de ${fullName(l)} ?`)) return; try { await api('/api/leads?id=' + id, {method: 'DELETE'}); leads = leads.filter(x => x.id !== id); closeLead(); render(); toast('Fiche supprimée'); } catch (err) { toast(err.message); } };
}
function closeLead() { current = null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeLead;
addEventListener('keydown', e => { if (e.key === 'Escape') closeLead(); });
async function update(id, patch, msg) {
  try {
    const {lead} = await api('/api/leads', {method: 'PATCH', body: {id, ...patch}});
    leads = leads.map(x => x.id === id ? lead : x);
    const n = leads.filter(l => l.statut === 'nouveau').length; $('#c-new').hidden = !n; $('#c-new').textContent = n;
    render(); if (current === id) openLead(id);
    toast(msg);
  } catch (err) { toast(err.message); }
}

// ---------- Nouvelle fiche ----------
$('#add-mod').innerHTML = ['À définir', ...Object.values(ROBES).map(r => r[0]), 'Just You — sur mesure'].map(n => `<option>${n}</option>`).join('');
$('#add').onclick = () => { $('#addf').reset(); $('#dlg').showModal(); };
$('#dlg').addEventListener('close', async () => {
  if ($('#dlg').returnValue !== 'ok') return;
  const d = Object.fromEntries(new FormData($('#addf'))); if (d.modele === 'À définir') d.modele = '';
  try { const {lead} = await api('/api/leads', {method: 'POST', body: d}); leads.unshift(lead); render(); openLead(lead.id); toast('Fiche créée'); } catch (err) { toast(err.message); }
});

// Démarrage
if (token) start(); else $('#login').hidden = false;
</script>
</body>
</html>
